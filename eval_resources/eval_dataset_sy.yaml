  question: 광주과학기술원(GIST) '연계 모듈 변경 사업'과 국방과학연구소 '기록관리시스템 통합 활용 및 보안 환경 구축' 두 문서에서
    각각의 시스템 연계/전송 구성 요소와 보안 인프라 구성 요소를 비교 설명하시오. (기관명 및 사업명 포함)
  expected_answer: GIST의 연계 모듈 변경 사업은 ZEUS-RCMS 간의 시스템 연계에 초점을 두고 있으며, '이체 실행' 기능
    추가, 부가세 전송 시 세액 포함 여부 수정, RCMS 연계전송 건의 계속비(이월금) 선 집행 같은 기능 요구(FUR-004, FUR-005,
    FUR-006)가 핵심이다(연구비 등록 → 연구비 전송 → 이체실행 흐름). 반면 국방과학연구소의 보안 환경 구축 프로젝트는 전자기록관 저장을
    위한 기록관리시스템의 통합 아키텍처와 보안 인프라 구성을 다루며, 통합정보시스템(온·나라, 연구지원, 전자도서관 등)과 통합연구개발정보체계에서
    기록을 이관해 전자기록관에 저장하는 구조를 제시하고, 구성요소로 사용자/관리자 페이지, 웹서버(Apache-Tomcat9), 물리 스토리지(논리
    50TB 단위), DB서버(MS SQL Server 2019), 운영서버(Active/Standby, Windows Server 2019)를
    명시한다.
