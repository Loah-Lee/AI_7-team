    \ 1년), 24시간 비상연락체계, 전담인력 배정, 장애원인 및 해결방법 문서화와 재발방지, 지체상금(계약금액 기준) 등의 구속성 있는 요구사항이\
    \ 명시되어 있음. \n- 비고: 이음은 CMS 관리, 로그 제공 및 관리자 보안·접근권한 관리 등의 콘텐츠 관리 체계에 초점을 두고 있으며,\
    \ MILE은 플랫폼 차원의 가용성 보장과 벌칙 체계에 주로 초점을 두고 있음."
