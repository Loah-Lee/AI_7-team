    다루고, 국립민속박물관 문서는 입찰/제안서 관련 서식과 소프트웨어 사업 지침 준수, 과업내용 확정/변경 절차를 다룹니다. 하도급/원 소속사
    명시 의무 차이: 국립민속박물관 문서는 원 소속사를 반드시 명시해야 하며, 컨소시엄 외 인력은 하도급으로 간주하고 승인을 받지 않으면 컨소시엄
    구성원의 자사 인력으로 대체해야 한다는 점을 명확히 규정합니다. 반면 수협 문서는 ‘계약상대자’ 및 ‘수탁자’의 의무와 손해배상, 교육 의무
    등을 다루지만 원 소속사 명시에 대한 구체적 의무 규정은 제시되어 있지 않습니다. 계약 수행/입찰 절차 차이: 국립민속박물관 문서는 과업내용
    확정/변경 절차(과업심의위원회 개최 여부, 과업변경요청서 제출), 입찰 관련 서식(별지 13호 서식), 가격입찰 포함 범위, 적정 사업기간
    산정, 공동 활용 등 입찰·계약 전후의 구체적 절차를 명시합니다. 반면 수협 문서는 계약 체결 후 이행에 대한 의무(교육, 시정 요구, 손해배상)와
    계약서 보관 등 실행 중심의 조항에 초점이 맞춰져 있으며, 입찰 심의 절차나 구체적 서식에 대한 규정은 제시되지 않습니다.'
