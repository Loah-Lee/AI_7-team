- id: eval_05
  question: 수협중앙회가 발주한 '수협중앙회 수산물사이버직매장 시스템 재구축 ISMP 수립'와 문화체육관광부 국립민속박물관의 '2024년
    국립민속박물관 민속아카이브 사업'에 관한 문서에서 하도급 및 원 소속사 명시 의무와 계약 수행/입찰 절차에 관한 규정은 어떻게 서로 다른가요?
  expected_answer: 두 문서는 계약 및 입찰에 관한 서류·절차와 계약 당사자 및 인력의 역할과 책임을 규정한다. 국립민속박물관의 '2024년
    민속아카이브 사업' 문서는 원 소속사 명시 의무를 명확히 하고, 컨소시엄 외 인력을 하도급으로 간주해 승인 없이 대체할 수 없음을 규정하며
    과업내용 확정/변경 절차와 입찰 서식 등을 구체적으로 제시한다. 반면 수협중앙회의 '수협중앙회 수산물사이버직매장 시스템 재구축 ISMP 수립'은
    계약 이행에 필요한 의무(교육, 시정 요구, 손해배상) 등에 초점을 두고 있으며, 하도급 원 소속사 명시 의무나 구체적 입찰 절차·서식은 문서에
    명시되지 않는다.
  ground_truth:
    sources:
