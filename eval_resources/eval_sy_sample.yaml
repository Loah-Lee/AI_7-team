- id: eval_07
  question: 한국장애인문화예술원 『2024년 장애인문화예술정보시스템 이음』과 대전대학교 『다층적 융합 학습경험 플랫폼(MILE) 구축 제안요청서』의
    가용성(24/7), 장애대응 시간, 하자보수 및 벌칙 등 유지보수 관련 요구사항을 비교하고 정리해 주세요. 두 기관/사업명을 함께 명시해 주세요.
  expected_answer: '한국장애인문화예술원 이음과 대전대학교 MILE의 유지보수 요구사항 비교를 정리하면, 가용성은 이음이 1일 24시간
    365일 중단 없이 이용 가능하고 MILE은 365일 24시간 안정적 서비스와 정기 백업/복구 대책이 필요합니다.

    장애대응 시간은 이음이 2시간 이내 투입, 4시간 이내 장애복구인 반면 MILE은 4시간 이내 도착, 6시간 이내 정상가동입니다.

    하자보수 및 벌칙은 이음의 경우 문서상 명시되지 않음(운영 요건으로 신속 조치·이력관리·인수인계가 제시됨). 반면 MILE은 무상 하자보수
    최소 1년, 24시간 비상연락체계, 전담인력 배정, 장애원인 및 해결방법 문서화와 재발방지, 지체상금 등 구속성 있는 조항이 문서상 명시되어
    있으며, 이음은 CMS 관리·로그 제공 등 콘텐츠 관리 체계에 더 초점을 둡니다.'
  ground_truth:
    sources:
    - source: 재단법인 한국장애인문화예술원_2024년 장애인문화예술정보시스템 이음.md
      page: 10
    - source: 대전대학교_대전대학교 2024학년도 다층적 융합 학습경험 플랫폼(MILE) 전.md
      page: 17
  query_type: comparison
  metadata_filter: {}
