    산단 안전정보시스템에서는 OEM/ODM 제품을 제외하고 모든 HW·SW에 대해 제조사의 '물품공급 및 기술지원확약서'를 제출해야 하며, 장비
    도입 및 설치 장소·구성 방안은 국가정보자원관리원의 G-클라우드 서비스 이용 사전검토와 발주처 협의를 거쳐 결정해야 합니다(아키텍처 정의서·시스템
