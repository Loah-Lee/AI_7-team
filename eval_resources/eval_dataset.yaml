  question: 2025 구미아시아육상경기선수권대회 조직위원회(입찰서약서)와 파주도시관광공사('종량제봉투 판매관리 전산시스템 개선사업') 요구사항을
    각각 따르는 업체는 어떤 윤리·제재 의무와 어떤 재고·거래 기록·전송 기능을 충족해야 합니까?
  expected_answer: '구미 아시아육상경기 조직위원회(입찰서약서): 입찰과정에서 담합·공정경쟁 저해 행위 금지 및 관계공무원에 대한 뇌물·금품
    제공 금지. 위반 시 담합 주도자는 조직위 발주 입찰 참가자격 제한 2년, 입찰자간 사전 가격협정·담합은 1년, 담합 적발 시 공정위 고발
    및 과징금 부과에 대한 이의 제기 금지. 뇌물 제공으로 계약 유리·부실시공 초래 시 2년, 관계 직원에게 유리하도록 뇌물 제공 시 1년, 금품·향응
    제공 사실은 6개월 참가제한.  파주도시관광공사(전산시스템 요구사항): 종량제물품의 기초재고 등록(관리자 전용) 및 창고별 재고 관리, 공급신청(일반/불량/부족분)
    등록·조회·확정(입고처리·취소) 및 박스·묶음·낱장 단위 처리, 인수(제작)등록(공급신청 연계 또는 직접 등록) 및 인수현황 출력, 폐업입고·시반납·환불입고·폐기처리의
    등록·조회·확정을 통한 재고 반영 및 현황 출력, 공급신청서 출력·팩스전송(직인 출력) 등 문서출력·전송 기능. 또한 전자계산서 국세청 전송·현황조회,
    합계표 및 통계조회, 기간별 판매소별 발행내역 조회, 문자/팩스 전송내역 등 전송·통계·로그 기능을 통해 거래기록과 추적성을 확보해야 함.'
