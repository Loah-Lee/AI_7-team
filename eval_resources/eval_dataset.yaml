  question: 한국철도공사 용역 '운행정보기록 자동분석시스템'과 한국연구재단 사업 '2024년 대학산학협력활동 실태조사 시스템(UICC) 기능개선'에서
    위반 발생 시 책임과 제재·이행절차는 어떻게 다른가요?
  expected_answer: 한국철도공사(운행정보기록 자동분석시스템)는 주로 현장 안전·운행 지장·인적·물적 피해를 초래한 계약상대자의 귀책을
    규정하며, 관련법령·철도안전관리체계에 따를 것을 명시하고 공사가 개선요청·이행권고를 할 수 있고, 지연손실·피해보상 책임은 계약상대자에게 있으며
    필요시 피해구상도 가능하다. 일부 안전조항은 적용대상(차량·시설·전기 등)을 한정하고 페널티 부과는 계도기간 이후('24.12.01부터) 시행됨을
    밝힌다. 반면 한국연구재단(UICC 기능개선)은 정보보안 위반을 수준별(경미·보통 등)로 분류하고 위반 유형별 사례를 제시한 뒤, 특별보안교육·서면·경고·경징계
    등 내부 징계와 사유서 징구, 조사·재발방지·이행점검 절차를 규정하며 위약금 부과를 등급(A~D)으로 차등화하는 등 세부한 처분·절차 규정을
    포함한다. 요약하면 철도공사는 안전책임·손해배상·시행시한과 법적 근거를 강조하는 반면, 연구재단은 정보보안 위반의 등급화된 징계·교육·점검
    절차와 위약금 등급 분류를 구체적으로 규정한다.
  ground_truth:
    source: 한국철도공사 (용역)_[재공고][긴급][협상형]운행정보기록 자동분석시스.hwp
