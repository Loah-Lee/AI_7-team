  question: 기초과학연구원 '2025년도 중이온가속기용 극저온시스템 운전 용역'과 한국농어촌공사 '네팔 수자원관리 정보화사업‑Pilot 시스템
    구축용역'에서 요구하는 주된 업무와 관리 초점은 어떻게 다른가?
  expected_answer: 기초과학연구원(중이온가속기 극저온시스템)은 주로 현장 운전·모니터링·제어와 주요 수치의 기록·분석, 24시간 교대운전(가동기간)
    및 주간 중심의 유지보수·운전 경험 통합(휴지기간)에 초점을 둔다. 운전 장소는 극저온설비동과 헬륨압축기동(방사선구역 일부 제외)에 한정된다.
    반면 한국농어촌공사(네팔 수자원관리 정보화사업)는 보안요구·제약사항·성능·인터페이스·시험(단위·통합·시스템·인수) 및 품질요구를 충족시키기
    위한 구체적 설계·구현·테스트 방안과 일정·위험·보안·산출물 형상·문서관리 등 프로젝트 관리 방법론 수립에 중점을 둔다.
  ground_truth:
