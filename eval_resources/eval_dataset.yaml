- id: eval_015
  question: 한국해양조사협회의 '2024년 항해용 간행물 품질관리 업무보조 시스템 구축' 용역을 수행한 업체가 경기도 평택시의 '2024년도
    평택시 버스정보시스템(BIS) 구축사업' 입찰에 해당 실적을 제출하려면 어떤 제출서류와 준수사항(비밀정보 취급·사본허가·하도급·공동도급·위약·실적증명원
    등)을 충족해야 하나요?
  expected_answer: '요약: 두 문서를 근거로, 해당 실적을 제출하려면 아래를 충족해야 합니다. 1) 비밀관리·사본허가: 한국해양조사협회
    계약상 비밀정보는 발주기관이 승인한 자만 취급 가능하며(허가받지 않은 복제·누설 금지), 제공받은 비밀정보나 그에 기초한 자료는 신중히 보관하고(복사본
    포함) 발주기관 요구 시 즉시 반환해야 하므로(계약종료 후 포함) 실적 제출 시 발주기관의 자료 제공·복사 허가를 받아야 합니다. 2) 책임·위약:
    동해·독도 표기 오류 등으로 사회적 문제가 발생하면 협회는 보안위규에 따른 위약금·손해배상을 부과할 수 있으니(제7·제8조) 관련 분쟁·위약
    사실은 입찰 시 유의해야 합니다. 3) 평택시 실적기재 및 증빙: 최근 3년간 유사사업 수행실적 표에 사업명, 사업개요, 사업기간(완료·진행중
    구분), 계약금액(천원), 발주처, 사업책임기술자 등을 기재하고 각 건별 실적증명원(사업명·기간·계약금액·책임기술자·총투입인원·자격명칭·사업내용
    등)을 첨부해야 합니다. 4) 하도급·공동도급 처리: 하도급 실적은 발주기관의 승인 받은 경우만 기재 가능하며, 공동도급은 계약금액란에 제안사
    지분만 기재해야 합니다. 5) 기타: 현재 수행 중인 업무도 연도순으로 포함하고, 모든 증빙은 부록으로 첨부해야 합니다.'
