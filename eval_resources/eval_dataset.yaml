    \ 해외 수행기간 2점, 국내 수행기간 2점으로 구분한다.\n\n2. 투입인력 자격 및 경력 합산 규칙\n- 석사 학위는 2년, 박사 학위는\
    \ 5년을 경력으로 합산한다.\n- 관련 기능사·산업기사·기사는 2년, 관련 기술사는 5년을 경력으로 합산한다.\n- 실적인정 범위는 참여\
