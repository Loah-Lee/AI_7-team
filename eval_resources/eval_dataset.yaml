    1차 구축 용역'의 HW/SW 조달·기술지원 요구사항을 모두 고려할 때, 계약상대자가 제출·이행해야 할 유지관리·보안 의무와 제조사 관련 제출서류
    및 클라우드 검토 절차는 무엇인가요?
  expected_answer: 광주문화예술통합플랫폼(광주문화재단) 측에서는 계약상대자가 정기점검 계획서·정기·수시 점검 보고서를 문서화하고 유지보수내역서를
    산출하며, 정보보안시스템을 이용한 취약점 진단·점검 및 사이버 침해사고 예·경보 대응 시 적극 협조해야 합니다. 또한 전산장비(OS 등) 업그레이드·패치로
