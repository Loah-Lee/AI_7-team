    조건과 제출해야 할 프로젝트관리/개발방법론 관련 문서는 무엇입니까?
  expected_answer: '수협중앙회(강릉어선안전조업국): 유사사업 실적은 총금액 3억 원 이상(특히 LED 전광판 디스플레이(영상제어컨트롤러
    포함) 구축 사업 실적이 필요하며 단순 물품납품은 제외). 기술인력 보유상태는 평가표로 산정(1~2인=1점, 3~4인=2점, 5~6인=3점,
