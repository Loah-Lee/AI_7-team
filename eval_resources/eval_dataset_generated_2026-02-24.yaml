- id: eval_020
  question: 대한장애인체육회(2025년 전국장애인체육대회 전산 및 시스템, 홈페이지)의 청렴계약이행서약서에 명시된 반부패·제재 조항과 한국발명진흥회(2024년
    건설기술에 관한 특허·실용신안 활용실) 입찰공고의 전자결제·내부결재 기능 요구사항은 각각 어떻게 결제·결재의 투명성과 공정성을 보장하나요?
    두 기관을 비교하여 간결히 설명해 주세요.
  expected_answer: '대한장애인체육회: 서약서는 담합·뇌물 제공 금지와 위반 시 입찰참가자격 제한(6개월~2년), 낙찰취소·계약해지
    등 행정적·법적 제재를 규정하고 회사윤리강령 제정 및 내부제보자 보호 등 조직적·규범적 수단으로 부패 방지와 공정성 확보를 요구합니다(기술적
    결제 방식은 명시되어 있지 않음). 한국발명진흥회: 시스템 요구사항은 전자결제 연동(NHN KCP PG 유지), 내부결재자 결재·최종승인문서
    자동작성·발송, 알림·확인 기능, 전체파일 일괄다운로드 및 로그·보안관리 등 기술적·절차적 통제로 결재 흐름의 추적성·투명성·감사 가능성을
    제공합니다(제재 조항은 제시되지 않음). 결론: 대한장애인체육회는 규범·제재 중심, 한국발명진흥회는 시스템·프로세스 중심의 통제 방식으로 상호
    보완적이다.'
  ground_truth:
    source: 대한장애인체육회_2025년 전국장애인체육대회 전산 및 시스템, 홈페이지 .hwp
