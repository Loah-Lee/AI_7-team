    institution: 고려대학교
- id: eval_019
  question: 한국재정정보원의 'e나라도움 업무시스템 웹 접근성 컨설팅'과 파주도시관광공사의 '종량제봉투 판매관리 전산시스템 개선사업'의 주요
    목적과 사업 범위는 어떻게 다른가요?
  expected_answer: 한국재정정보원 e나라도움 컨설팅은 기존 업무시스템의 웹 접근성 개선을 목적으로 하는 컨설팅 사업으로, 계약일로부터
    120일(약 4개월) 동안 웹 접근성 진단·개선 권고(컨설팅 요구사항), 보안·품질·프로젝트 관리 등 제반 요구사항을 다루는 것이 주요 범위입니다.
    반면 파주도시관광공사 종량제봉투 개선사업은 전산관리 시스템 구축·인터넷 주문 연동·온라인 카드·가상계좌 결제 도입·반응형 웹 구현·전자정부
    표준프레임워크 적용·기존 판매시스템 자료 이관·지정판매소 조회 등 실무 시스템 개발 및 운영을 통한 결제 다각화·주문 편의성·재고·통계관리·수요예측
    등 운영 효율성 제고가 주된 목적입니다.
  ground_truth:
    source: 한국재정정보원_e나라도움 업무시스템 웹 접근성 컨설팅.hwp
