- id: eval_018
  question: '고려대학교 차세대 포털·학사 정보시스템 구축사업의 ''성적확정관리'' 기능(성적입력관리·이수구분변경관리)을 구현할 때, 남서울대학교
    ''스마트 정보시스템 활성화(학사)'' 사업의 세부 기술지침(예: SOAP/REST, XML, UDDI, BPMN, POSIX/Windows/Linux,
    전자정부 표준프레임워크 등)이 상호연계·데이터교환·배치처리·알림 등 해당 기능 요구사항을 지원하기에 적합한가?'
  expected_answer: 대체로 적합하다. 남서울대 지침은 웹서비스(SOAP 1.2, WSDL 2.0, RESTful), 데이터형식(XML),
    서비스발견(UDDI), 업무프로세스(BPMN/UML), 다중플랫폼(OS/서버/모바일) 및 DB 종류, 전자정부 표준프레임워크 등 통합·데이터교환·업무자동화·배치처리·UI
    구현에 필요한 표준을 제시하고 있어 고려대의 성적입력 일괄처리, 백분위·총점 계산 연계, 알림·캘린더 연동, 학칙 기반 이수구분 처리 등 구현을
    기술적으로 뒷받침할 수 있다. 다만 남서울대 문서는 표준 목록 수준으로, 성적 산출 규칙·세부 API/메시지 스키마·권한·인증·보안(인증·암호화)·업무정책(이수구분
    변경 불가사유 등) 같은 구체적 설계·정의는 제공하지 않으므로 실제 구현을 위해서는 추가적인 데이터 모델링, 보안·인증 요구사항 정의, API
    설계 및 업무 규칙 정립이 필요하다.
  ground_truth:
    source: 고려대학교_차세대 포털·학사 정보시스템 구축사업.pdf
    page: 107
  query_type: comparison
