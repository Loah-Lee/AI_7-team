- id: eval_017
  question: 재단법인충북연구원의 'GIS/통계 기반 재난안전데이터 분석·관리 시스템 구축 용역' 문서와 인천광역시의 '인천일자리플랫폼 정보시스템
    구축 ISP 수립용역' 문서를 비교할 때, 사업 종료 시 제공자료·장비의 반납·삭제 절차와 참여인원 교체·신상변동 관리 의무는 어떻게 다른가요?
  expected_answer: 인천광역시(인천일자리플랫폼) 문서는 사업 종료 시 인천이 제공한 자료·장비·산출물을 전량 반납하고 복사본 보관을
    금지하며, 계약업체 소유 장비의 자료는 국가정보원 인증 데이터 영구삭제 제품으로 완전 삭제하고 반납·삭제 증거를 ‘자료 인계인수대장’에 기록하도록
    명시한다. 또한 업체는 대표 명의의 보안확약서를 제출해야 하고, 참여인원은 임의 교체 불가·신상변동(해외여행 포함) 즉시 보고, 보안관리책임자
    지정 및 주기적 보안교육 참여 의무를 둔다. 반면 재단법인충북연구원 문서는 일상적 보안위반 사례와 징계·교육(위규자 대상 특별보안교육 등),
    사무실·정보 보호수칙(자료 방치 금지, 보조기억매체 통제, 비인가 프로그램 사용 금지 등)을 상세히 규정하지만, 청크에선 사업 종료 시의 장비
    반납·공식적 삭제 절차나 대표 보안확약서 제출, 참여인원 교체·신상변동의 즉시 보고 의무와 같은 명시적 계약종료·인사관리 규정을 제시하지 않는다.
  ground_truth:
    source: 재단법인충북연구원_GIS통계 기반 재난안전데이터 분석ㆍ관리 시스템 구.hwp
    page: 25
