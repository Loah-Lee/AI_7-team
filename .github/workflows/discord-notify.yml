# License: MIT (template code)
name: Notify Discord (feature push + main merge only) - AI_7-team

on:
  # feature/** 와 dev 에서 push 알림
  push:
    branches:
      - dev
      - "feature/**"

  # main은 push가 아니라 "PR merge"로만 알림
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Build payload (safe JSON)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - << 'PY' > payload.json
          # License: MIT (template code)
          import os, json

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_path = os.environ["GITHUB_EVENT_PATH"]

          with open(event_path, "r", encoding="utf-8") as f:
              ev = json.load(f)

          repo = os.environ.get("REPO", "")
          run_url = os.environ.get("RUN_URL", "")

          def clip(s: str, n: int = 280) -> str:
              s = (s or "").strip()
              if not s:
                  return ""
              return s if len(s) <= n else s[: n - 1] + "…"

          def bullets(lines, max_items=10):
              lines = [ln for ln in lines if ln]
              if not lines:
                  return ""
              shown = lines[:max_items]
              more = len(lines) - len(shown)
              out = "\n".join(f"- {ln}" for ln in shown)
              if more > 0:
                  out += f"\n- … (+{more} more)"
              return out

          # merge commit 판별 (GitHub 기본 merge commit 메시지)
          def is_merge_commit_message(msg: str) -> bool:
              msg = (msg or "").lstrip()
              return msg.startswith("Merge pull request #") or msg.startswith("Merge branch ")

          content_parts = []

          # -------------------------
          # PUSH: feature/**, dev 만
          # - merge commit은 제외
          # - 전부 merge commit이면 알림 스킵
          # -------------------------
          if event_name == "push":
              branch_ref = ev.get("ref", "")
              branch = branch_ref.replace("refs/heads/", "")
              pusher = (ev.get("pusher") or {}).get("name") or (ev.get("sender") or {}).get("login", "unknown")

              compare_url = ev.get("compare") or ""
              commits = ev.get("commits") or []

              # merge commit 제외하고 남기는 커밋들만 리스트로 만든다
              items = []
              kept = 0
              for c in commits:
                  msg_full = c.get("message") or ""
                  msg_first = msg_full.splitlines()[0] if msg_full else ""
                  if is_merge_commit_message(msg_first):
                      continue

                  kept += 1
                  sha = (c.get("id") or "")[:7]
                  author = ((c.get("author") or {}).get("name") or "unknown")
                  items.append(f"{author}: {clip(msg_first, 90)} ({sha})")

              # 남은 게 0이면(=전부 merge commit이면) 아예 알림 스킵
              if kept == 0:
                  print(json.dumps({"__skip__": True}, ensure_ascii=False))
                  raise SystemExit(0)

              content_parts.append(f"✅ **PUSH**  `{repo}`")
              content_parts.append(f"🌿 Branch: `{branch}`")
              content_parts.append(f"👤 Pusher: **{pusher}**")
              content_parts.append(f"📦 Commits (excluding merge commits): **{kept}**")
              content_parts.append(bullets(items, max_items=10))

              if compare_url:
                  content_parts.append(f"🔗 Compare: {compare_url}")
              if run_url:
                  content_parts.append(f"🧾 Actions: {run_url}")

          # -------------------------
          # PR MERGE: main으로 merge된 경우만 알림
          # -------------------------
          elif event_name == "pull_request":
              action = ev.get("action", "")
              pr = ev.get("pull_request") or {}

              # closed 이벤트만 받고 있지만, merged 여부를 다시 확인
              merged = bool(pr.get("merged", False))
              base = ((pr.get("base") or {}).get("ref") or "")

              # main에 "머지"가 아니면 알림 스킵
              if action != "closed" or (not merged) or base != "main":
                  print(json.dumps({"__skip__": True}, ensure_ascii=False))
                  raise SystemExit(0)

              number = pr.get("number") or ev.get("number")
              title = pr.get("title") or ""
              author = (pr.get("user") or {}).get("login", "unknown")
              head = ((pr.get("head") or {}).get("ref") or "")
              url = pr.get("html_url") or ""
              body = clip(pr.get("body") or "", 350)
              merged_by = ((pr.get("merged_by") or {}).get("login") or "unknown")

              content_parts.append(f"✅ **MERGED INTO MAIN**  `{repo}`  #{number}")
              content_parts.append(f"👤 PR Author: **{author}**")
              content_parts.append(f"🧷 Merged by: **{merged_by}**")
              content_parts.append(f"🌿 `{head}` → `main`")
              content_parts.append(f"📝 Title: {clip(title, 200)}")
              if body:
                  content_parts.append(f"📄 Body: {body}")
              if url:
                  content_parts.append(f"🔗 PR: {url}")
              if run_url:
                  content_parts.append(f"🧾 Actions: {run_url}")

          else:
              # 여기서는 push / pull_request 외 이벤트는 받지 않지만,
              # 혹시 모를 경우를 대비해 스킵 처리
              print(json.dumps({"__skip__": True}, ensure_ascii=False))
              raise SystemExit(0)

          content = "\n".join([p for p in content_parts if p]).strip()
          print(json.dumps({"content": content}, ensure_ascii=False))
          PY

      - name: Send Discord (skip if needed)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # payload.json에 "__skip__"이 있으면 전송하지 않음
          python - << 'PY'
          import json
          with open("payload.json","r",encoding="utf-8") as f:
              data = json.load(f)
          if data.get("__skip__"):
              raise SystemExit(0)
          PY

          curl -f -sS -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
