# License: MIT (template code)
name: Notify Discord on Push (AI_7-team)

on:
  push:
    branches:
      - main
      - dev
      - feature/yc
      - feature/kt
      - feature/jh
      - feature/jw
      - feature/sy

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message (safe JSON)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          python - << 'PY' > payload.json
          import os, json
          content = (
              f"✅ Push: {os.environ['REPO']}\n"
              f"🌿 Branch: {os.environ['BRANCH']}\n"
              f"👤 By: {os.environ['ACTOR']}\n"
              f"📝 {os.environ.get('COMMIT_MSG','')}\n"
              f"🔗 {os.environ.get('COMMIT_URL','')}"
          )
          print(json.dumps({"content": content}, ensure_ascii=False))
          PY
      
          curl -f -sS -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
