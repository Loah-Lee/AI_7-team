# License: MIT (template code)
name: Discord Notify (main/dev push + PR) - AI_7-team

on:
  # main/dev push 알림 추가
  push:
    branches:
      - main
      - dev

  # PR 관련 (main/dev 대상)
  pull_request:
    branches:
      - main
      - dev
    types: [opened, reopened, synchronize, closed, edited, ready_for_review]

  issue_comment:
    types: [created]

  pull_request_review:
    types: [submitted]

  pull_request_review_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Discord payload
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - << 'PY' > payload.json
          # License: MIT (template code)
          import os, json, datetime

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_path = os.environ["GITHUB_EVENT_PATH"]

          with open(event_path, "r", encoding="utf-8") as f:
              ev = json.load(f)

          repo = os.environ.get("REPO", "")
          server_url = os.environ.get("SERVER_URL", "https://github.com")
          run_url = os.environ.get("RUN_URL", "")

          now_iso = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"

          def clip(s, n=160):
              s = (s or "").strip()
              return s if len(s) <= n else s[: n - 1] + "…"

          def build(embed):
              return {"embeds": [embed]}

          def skip():
              print(json.dumps({"__skip__": True}, ensure_ascii=False))
              raise SystemExit(0)

          # -----------------------------------
          # PUSH (main / dev)
          # -----------------------------------
          if event_name == "push":
              branch = ev.get("ref","").replace("refs/heads/","")
              sender = (ev.get("sender") or {}).get("login") or "unknown"
              commits = ev.get("commits") or []
              compare = ev.get("compare") or ""

              lines = []
              for c in commits[:3]:
                  msg = (c.get("message") or "").splitlines()[0]
                  sha = (c.get("id") or "")[:7]
                  url = c.get("url") or ""
                  lines.append(f"• {clip(msg,70)} `{sha}`")

              more = len(commits) - len(commits[:3])
              if more > 0:
                  lines.append(f"• … (+{more} more)")

              embed = {
                  "title": f"{repo} · push → `{branch}`",
                  "url": compare or f"{server_url}/{repo}",
                  "description": "\n".join(lines),
                  "fields": [
                      {"name": "By", "value": f"`{sender}`", "inline": True},
                      {"name": "Commits", "value": f"`{len(commits)}`", "inline": True},
                  ],
                  "footer": {"text": f"Actions · {run_url}"},
                  "timestamp": now_iso,
              }

              print(json.dumps(build(embed), ensure_ascii=False))
              raise SystemExit(0)

          # -----------------------------------
          # PULL REQUEST
          # -----------------------------------
          if event_name == "pull_request":
              action = ev.get("action")
              pr = ev.get("pull_request") or {}

              number = pr.get("number")
              title = pr.get("title") or ""
              author = (pr.get("user") or {}).get("login") or "unknown"
              base = ((pr.get("base") or {}).get("ref") or "")
              head = ((pr.get("head") or {}).get("ref") or "")
              url = pr.get("html_url") or ""

              merged = bool(pr.get("merged", False))

              if action == "closed" and merged:
                  kind = "MERGED"
              else:
                  kind = f"PR {action}"

              embed = {
                  "title": f"{repo} · {kind}",
                  "url": url,
                  "description": f"**#{number}** {clip(title,120)}",
                  "fields": [
                      {"name": "From", "value": f"`{head}`", "inline": True},
                      {"name": "To", "value": f"`{base}`", "inline": True},
                      {"name": "Author", "value": f"`{author}`", "inline": True},
                  ],
                  "footer": {"text": f"Actions · {run_url}"},
                  "timestamp": now_iso,
              }

              print(json.dumps(build(embed), ensure_ascii=False))
              raise SystemExit(0)

          # -----------------------------------
          # ISSUE COMMENT (PR only)
          # -----------------------------------
          if event_name == "issue_comment":
              issue = ev.get("issue") or {}
              if not issue.get("pull_request"):
                  skip()

              number = issue.get("number")
              title = issue.get("title") or ""
              comment = ev.get("comment") or {}
              user = (comment.get("user") or {}).get("login") or "unknown"
              body = clip(comment.get("body") or "",150)
              url = comment.get("html_url")

              embed = {
                  "title": f"{repo} · PR comment",
                  "url": url,
                  "description": f"**#{number}** {clip(title,120)}\n{body}",
                  "fields": [
                      {"name": "By", "value": f"`{user}`", "inline": True},
                  ],
                  "footer": {"text": f"Actions · {run_url}"},
                  "timestamp": now_iso,
              }

              print(json.dumps(build(embed), ensure_ascii=False))
              raise SystemExit(0)

          skip()
          PY

      - name: Send Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - << 'PY'
          import json
          with open("payload.json","r",encoding="utf-8") as f:
              data = json.load(f)
          if data.get("__skip__"):
              raise SystemExit(0)
          PY

          curl -f -sS -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
