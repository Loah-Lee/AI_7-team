  question: 한국대학스포츠협의회(KUSF)의 ‘체육특기자 경기력 평가지표 개발’(특히 시뮬레이션 단계)에서 개인별 경기력 데이터를 처리·관리하는
    시스템을 구축할 때, 평택시 ‘케빈랩 주식회사_강소형 스마트시티 AI 기반 영상감시 시스템’ RFP의 기술적 보안요건(SER-002) 중 어떤
    보안 조치를 반드시 적용해야 하나요?
  expected_answer: 'KUSF의 개인 경기력 평가지표 시스템(개발·시뮬레이션 단계 포함)에 대해 SER-002의 기술적 보안요건을 적용하면
    다음 조치를 포함해야 한다: 사용자 권한에 따른 접근제어 구현; 네트워크 관리자 등 계정의 복잡한(기본이 아닌) 패스워드 사용; 사업계획·분석단계부터
    소스 프로그램의 안전성 반영(안전한 개발); 서버·시스템에 대한 보안 취약성 사전점검 및 보완; 개발자용 PC 패스워드 사용 및 주기적 변경;
    정기적 바이러스·해킹 도구 검사; 백업정책 수립·실행(복구 가능성 확보); 개인정보·주요정보의 저장·전송·전달 시 법적 요구사항 반영한 암호화
    적용(대상·강도·정책 수립 포함); 최소권한 원칙에 따른 사용자 등록·해지·권한 부여·변경·말소 절차 수립·이행; 안전한 인증 절차 및 필요시
    강화된 인증 적용; 계정 등록·이용·삭제 및 권한 변경 이력 기록·주기적 검토; 보호구역 외 시스템 관리·개인정보 처리는 원칙 금지하되 원격접근이
    불가피한 경우 책임자 승인, 접근 단말 지정·범위·기간 설정, 강화된 인증, 구간 암호화, 접속 단말 보안 등 보호대책 수립·적용.'
