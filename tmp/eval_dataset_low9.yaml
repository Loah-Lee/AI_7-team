    받은 장비·서류·중간·최종산출물 전량 반납·삭제(복사본 보관 금지), 전자매체는 교육부 지침(제40조 제4항)에 따른 삭제 후 반출, 대표자·참여자용
    보안확약서 제출 및 대학 담당자의 보안조치 확인서 작성 등 보안관리조치를 이행해야 한다.
