    등록·조회·확정을 통한 재고 반영 및 현황 출력, 공급신청서 출력·팩스전송(직인 출력) 등 문서출력·전송 기능. 또한 전자계산서 국세청 전송·현황조회,
    합계표 및 통계조회, 기간별 판매소별 발행내역 조회, 문자/팩스 전송내역 등 전송·통계·로그 기능을 통해 거래기록과 추적성을 확보해야 함.'
