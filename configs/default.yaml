# 입찰메이트 v17 기본 설정

llm:
  default_model: "gpt-4o-mini"
  reasoning_model: "gpt-5-mini"
  temperature: 0.7
  max_tokens: 1500

embedding:
  model: "text-embedding-3-small"
  dimension: 1536

retrieval:
  top_k: 10
  top_n: 5
  chunk_size: 1000
  chunk_overlap: 200

database:
  path: "./data/chroma_db_v17"
  collection_name: "rfp_docs_v17"
  space: "cosine"
